name: Build Opera Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy deps
        run: go mod tidy

      - name: Build EXE
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o opera.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opera-windows-amd64
          path: opera.exe
